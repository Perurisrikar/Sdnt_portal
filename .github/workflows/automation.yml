name: Daily Scraper and Upload

# Triggered by cron-job.org (workflow_dispatch) at ~12:00 PM and ~3:15 PM IST.
# The schedule below is only a backup; GitHub's own cron often runs late.
on:
  workflow_dispatch:
  schedule:
    - cron: '35 6 * * *'   # 12:05 PM IST
    - cron: '45 9 * * *'   # 3:15 PM IST

concurrency:
  group: scrape-and-deploy
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install Python libraries
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          MAX_WORKERS: '5'
          VIGNAN_USER: ${{ secrets.VIGNAN_USER }}
          VIGNAN_PASS: ${{ secrets.VIGNAN_PASS }}
        run: python scraper.py

      # =========================
      # FTP SERVER 1
      # =========================
      - name: Upload to FTP Server 1
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./data/
          server-dir: /htdocs/data/
          state-name: .ftp-deploy-sync-state-server1.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .ftp-deploy-sync-state*.json

      # =========================
      # FTP SERVER 2
      # =========================
      - name: Upload to FTP Server 2
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER_2 }}
          username: ${{ secrets.FTP_USERNAME_2 }}
          password: ${{ secrets.FTP_PASSWORD_2 }}
          local-dir: ./data/
          server-dir: /htdocs/data/
          state-name: .ftp-deploy-sync-state-server2.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .ftp-deploy-sync-state*.json

      # Turns the run red (so GitHub emails you) if any section couldn't be
      # fetched, AFTER the sections that worked have already been uploaded.
      - name: Flag failed sections
        if: always()
        run: |
          python - <<'PY'
          import json, os, sys
          p = "data/_scrape_status.json"
          if not os.path.exists(p):
              sys.exit("No status file - the scraper did not finish.")
          failed = json.load(open(p)).get("failed", [])
          if failed:
              sys.exit("Sections not updated: " + ", ".join(failed))
          print("All sections updated.")
          PY
